# Local development override, loaded with docker-compose.yml through
# COMPOSE_FILE in .env. It adds Keycloak, the HTTPS gateway, the playground
# containers and the mobile-mode tunnel, and builds the patched Inji images.
x-java-environment: &java-environment
  # Caps the heap and uses a truststore that adds the local CA, so the Java
  # services accept the gateway's certificate when they call the public origin.
  JAVA_TOOL_OPTIONS: -Xmx768m -Djavax.net.ssl.trustStore=/home/mosip/certs/java-truststore -Djavax.net.ssl.trustStorePassword=changeit

services:
  # Local Keycloak, standing in for eSignet as the authorization server. The
  # image adds the credential nonce mapper that Certify needs (gap C2).
  keycloak:
    image: inji-playground-keycloak:26.0.8-local
    build:
      context: ./infra/inji/images/keycloak
    # Imports the rendered inji realm on first start; an existing realm is
    # left unchanged.
    command: [start-dev, --import-realm]
    # KC_HOSTNAME follows the public origin, including mobile mode.
    env_file: ./infra/inji/generated/origin.env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run npm run bootstrap}
      # Served under /auth behind the gateway, whose X-Forwarded headers
      # Keycloak trusts.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    volumes:
      - ./infra/inji/generated/keycloak:/opt/keycloak/data/import:ro
    # The image has no curl, so the check sends a raw HTTP request through
    # bash to the readiness endpoint on the management port.
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/localhost/9000; printf \"GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q UP <&3'"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 12
    depends_on:
      database:
        condition: service_healthy

  # Certify with the synthetic farmer data provider and the backported mDoc
  # holder-key fix (gap C5).
  certify:
    image: inji-playground-certify:0.14.0-local
    build:
      context: ./infra/inji/images/certify
    environment:
      <<: *java-environment
    volumes:
      - ./infra/inji/secrets/java-truststore:/home/mosip/certs/java-truststore:ro
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8090/v1/certify/issuance/.well-known/openid-credential-issuer | grep -q credential_issuer"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 12

  # Mimoto with the local fixes for gaps M4, M7 and M9.
  mimoto-service:
    image: inji-playground-mimoto:0.21.0-local
    build:
      context: ./infra/inji/images/mimoto
    environment:
      <<: *java-environment
    volumes:
      - ./infra/inji/secrets/java-truststore:/home/mosip/certs/java-truststore:ro
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8099/v1/mimoto/actuator/health]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 12

  # Verify keeps the upstream image; this adds the shared Java settings and a
  # health check.
  verify-service:
    environment:
      <<: *java-environment
    volumes:
      - ./infra/inji/secrets/java-truststore:/home/mosip/certs/java-truststore:ro
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:8080/v1/verify/actuator/health]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 12

  # Only caps DataShare's heap; it does not use the shared Java settings.
  datashare-service:
    environment:
      JAVA_TOOL_OPTIONS: -Xmx384m

  # The HTTPS gateway. gateway.local.conf replaces the base configuration at
  # the same path, routes protocol traffic through the playground bridge and
  # holds the mobile-mode listener on 8088, which is not published.
  gateway:
    # Added to the base file's HTTP port. 443 carries the canonical origin,
    # because Mimoto's verifier does not decode a port in a did:web (gap M11).
    # 8443 is the earlier HTTPS port, kept for compatibility.
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:${INJI_TLS_PORT:-8443}:8443"
    volumes:
      - ./infra/inji/config/gateway.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/inji/secrets/gateway.crt:/etc/nginx/tls/gateway.crt:ro
      - ./infra/inji/secrets/gateway.key:/etc/nginx/tls/gateway.key:ro
    # Containers resolve the public hostname to the gateway rather than to
    # their own loopback, so services can call the public origin.
    networks:
      default:
        aliases: [inji.127.0.0.1.sslip.io]
    depends_on:
      - keycloak
      - playground-server

  # The playground orchestrator and protocol bridge, built from this
  # repository.
  playground-server:
    build:
      context: .
      dockerfile: infra/playground/Dockerfile
      target: server
    # Settings rendered by prepare.mjs, with in-network service URLs.
    env_file: ./infra/inji/generated/playground.docker.env
    environment:
      # Trusts the local CA for HTTPS calls to the public origin.
      NODE_EXTRA_CA_CERTS: /certs/local-ca.crt
    volumes:
      - ./infra/inji/secrets/local-ca.crt:/certs/local-ca.crt:ro
    ports:
      - "127.0.0.1:8000:8000"
    # The slim Node image has no curl, so the check uses Node's fetch.
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  # The workbench: the built client served by nginx, which proxies /api/ to
  # the playground server.
  playground-client:
    build:
      context: .
      dockerfile: infra/playground/Dockerfile
      target: client
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      playground-server:
        condition: service_healthy

  # Mobile mode only: publishes the gateway's allowlisted listener on a
  # random *.trycloudflare.com HTTPS URL. Started by local/mobile.mjs.
  tunnel:
    image: cloudflare/cloudflared:2025.8.1
    profiles: [mobile]
    command: [tunnel, --no-autoupdate, --url, http://gateway:8088]
    # http2 (TCP 443) for networks that block the default QUIC over UDP.
    environment:
      TUNNEL_TRANSPORT_PROTOCOL: ${TUNNEL_TRANSPORT_PROTOCOL:-quic}
    depends_on:
      - gateway
