# Base stack: the Inji services behind a plain HTTP gateway, for use with an
# external authorization server. docker-compose.local.yml adds the local
# Keycloak, the HTTPS gateway and the playground containers. The fixed project
# name keeps the names of the persistent volumes stable.
name: inji-playground
services:
  # PostgreSQL with one database each for Certify, Mimoto and Verify, plus
  # Keycloak's in the local setup.
  database:
    image: postgres:15.10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Seed SQL rendered by prepare.mjs. PostgreSQL runs it only when the data
      # volume is empty; existing databases need a migration instead.
      - type: bind
        source: ./infra/inji/generated/database
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false
    # Checks over TCP: the temporary server that runs the seed scripts listens
    # only on a Unix socket, so dependants wait until seeding has finished.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Inji Certify, the OpenID4VCI issuer. The local override replaces the image
  # with a patched build from infra/inji/images/certify.
  certify:
    image: injistack/inji-certify-with-plugins:0.14.0
    user: root
    environment:
      container_user: mosip
      # Loads certify-default.properties and certify-csvdp-farmer.properties
      # from the rendered config folder mounted below.
      active_profile_env: default,csvdp-farmer
      SPRING_CONFIG_NAME: certify
      SPRING_CONFIG_LOCATION: /home/mosip/config/
      # Skips the startup downloads of plugin artifacts and the HSM client: the
      # image bundles its plugins and keys are kept in a local PKCS12 keystore.
      enable_certify_artifactory: "false"
      download_hsm_client: "false"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      CERTIFY_KEYSTORE_PASSWORD: ${CERTIFY_KEYSTORE_PASSWORD:?Set CERTIFY_KEYSTORE_PASSWORD}
    volumes:
      - type: bind
        source: ./infra/inji/generated/config
        target: /home/mosip/config
        read_only: true
        bind:
          create_host_path: false
      # Certify's signing keystore. Keep it with postgres-data, which holds the
      # matching key records.
      - certify-keys:/home/mosip/CERTIFY_PKCS12
    depends_on:
      database:
        condition: service_healthy

  # MinIO object storage behind DataShare.
  minio-service:
    image: mosipint/minio:2022.2.7-debian-10-r0
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - object-data:/data

  # MOSIP DataShare, a support service that Mimoto requires.
  datashare-service:
    image: mosipid/data-share-service:1.3.0-beta.2
    environment:
      active_profile_env: inji-default,standalone
      SPRING_CONFIG_NAME: data-share
      SPRING_CONFIG_LOCATION: /home/mosip/config/
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - type: bind
        source: ./infra/inji/generated/config
        target: /home/mosip/config
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - minio-service

  # Static file server in place of MOSIP's config server. Mimoto and Certify
  # fetch rendered files from it, such as the issuer list and CBEFF schema.
  config-server:
    image: nginx:1.26.3
    volumes:
      - type: bind
        source: ./infra/inji/config/static.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./infra/inji/generated/public
        target: /srv/inji
        read_only: true
        bind:
          create_host_path: false

  # Mimoto, the wallet backend behind Inji Web and the embedded wallet. The
  # local override replaces the image with a patched build from
  # infra/inji/images/mimoto.
  mimoto-service:
    image: injistack/mimoto:0.21.0
    user: root
    environment:
      container_user: mosip
      active_profile_env: default
      SPRING_CONFIG_NAME: mimoto
      SPRING_CONFIG_LOCATION: /home/mosip/config/
      SPRING_CLOUD_BOOTSTRAP_LOCATION: /home/mosip/config/mimoto-bootstrap.properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/inji_mimoto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      oidc_p12_password: ${MIMOTO_KEYSTORE_PASSWORD:?Set MIMOTO_KEYSTORE_PASSWORD}
      # Mimoto's properties reference these; resident wallet binding is not
      # part of this setup, so they stay empty.
      IDP_PARTNER_ENCRYPTION_KEY: ""
      WALLET_BINDING_PARTNER_API_KEY: ""
      # Credentials of the login client that Mimoto's configuration names
      # google. The local setup points that client at Keycloak.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?Set GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?Set GOOGLE_OAUTH_CLIENT_SECRET}
    volumes:
      - type: bind
        source: ./infra/inji/generated/config
        target: /home/mosip/config
        read_only: true
        bind:
          create_host_path: false
      # Mimoto's mutable keystore, seeded by wallet-keys-init. Keep it with
      # postgres-data.
      - wallet-keys:/home/mosip/certs
    depends_on:
      wallet-keys-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      datashare-service:
        condition: service_started
      config-server:
        condition: service_started

  # One-shot job that copies the tracked seed keystore into wallet-keys only if
  # it is absent, so Mimoto never modifies the seed. It runs as root to hand
  # the copy to Mimoto's user; exiting with code 0 is expected.
  wallet-keys-init:
    image: node:22.22.0-bookworm-slim
    user: root
    command: [node, /setup/initialize-wallet-keys.mjs]
    volumes:
      - type: bind
        source: ./infra/inji/scripts/initialize-wallet-keys.mjs
        target: /setup/initialize-wallet-keys.mjs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./infra/inji/secrets/oidckeystore.p12
        target: /seed/oidckeystore.p12
        read_only: true
        bind:
          create_host_path: false
      - wallet-keys:/keys

  # Inji Web, the browser wallet. origin.env supplies MIMOTO_URL for the
  # current public origin.
  inji-web:
    image: injistack/inji-web:0.16.0
    env_file: ./infra/inji/generated/origin.env
    environment:
      DEFAULT_LANG: en
    volumes:
      # Replaces the image's nginx site with the one in web.conf.
      - type: bind
        source: ./infra/inji/config/web.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - mimoto-service

  # Inji Verify, the OpenID4VP verifier.
  verify-service:
    image: injistack/inji-verify-service:0.17.0
    # INJI_VP_SUBMISSION_BASE_URL and INJI_VERIFY_REDIRECT_URI follow the public origin.
    env_file: ./infra/inji/generated/origin.env
    environment:
      active_profile_env: default
      DATABASE_HOST: database
      DATABASE_PORT: "5432"
      DATABASE_NAME: inji_verify
      DATABASE_SCHEMA: verify
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      INJI_VP_REQUEST_LONG_POLLING_TIMEOUT: "5000"
      # Adds the verifier DID and keystore settings rendered by prepare.mjs.
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/home/mosip/config/verify.properties
      INJI_KEYSTORE_FILE_PASS: ${VERIFY_KEYSTORE_PASSWORD:?Set VERIFY_KEYSTORE_PASSWORD}
    volumes:
      - type: bind
        source: ./infra/inji/generated/config/verify.properties
        target: /home/mosip/config/verify.properties
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./infra/inji/secrets/verify-keystore.p12
        target: /home/mosip/certs/verify-keystore.p12
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      database:
        condition: service_healthy

  # nginx gateway that puts the services behind one origin. Here it serves
  # plain HTTP on loopback; the local override swaps in the HTTPS
  # configuration and adds its ports.
  gateway:
    image: nginx:1.26.3
    ports:
      - "127.0.0.1:${INJI_GATEWAY_PORT:-8091}:80"
    volumes:
      - type: bind
        source: ./infra/inji/config/gateway.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      # Rendered static files that the gateway serves under /config/.
      - type: bind
        source: ./infra/inji/generated/public
        target: /srv/inji
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - certify
      - inji-web
      - mimoto-service
      - verify-service
      - datashare-service

# Persistent state. Back these up and restore them together: the keystores
# must match the key records in postgres-data.
volumes:
  postgres-data:
  certify-keys:
  object-data:
  wallet-keys:
