# Logs the path without its query string, so codes and tokens sent as query
# parameters stay out of the access log.
log_format inji '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status';
access_log /var/log/nginx/access.log inji;

# Base gateway for the setup with an external authorization server. It serves
# plain HTTP behind a TLS-terminating proxy and routes straight to the Inji
# services; there is no protocol bridge or playground in this setup.
server {
    listen 80;
    client_max_body_size 14m;
    proxy_read_timeout 65s;
    # The scheme is passed on from the proxy in front of the gateway.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_http_version 1.1;

    location /v1/certify/ {
        proxy_pass http://certify:8090;
    }
    # Issuer metadata and the issuer's did:web document at the origin root.
    location = /.well-known/openid-credential-issuer {
        proxy_pass http://certify:8090/v1/certify/issuance/.well-known/openid-credential-issuer;
    }
    location = /.well-known/did.json {
        proxy_pass http://certify:8090/v1/certify/.well-known/did.json;
    }
    location /v1/mimoto/ {
        proxy_pass http://mimoto-service:8099;
    }
    location /v1/verify/ {
        proxy_pass http://verify-service:8080;
    }
    location /v1/datashare/ {
        proxy_pass http://datashare-service:8097;
    }
    # Rendered static files, such as the JSON-LD context; Inji Web serves the
    # remaining paths.
    location /config/ {
        alias /srv/inji/;
    }
    location / {
        proxy_pass http://inji-web:3004;
    }
}
