# Logs the path without its query string, so codes, tokens and offers sent as
# query parameters stay out of the access log.
log_format inji '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status';
access_log /var/log/nginx/access.log inji;

# Main listener: the public HTTPS origin on 443, the earlier HTTPS port 8443,
# and plain HTTP on 80, which Compose publishes as INJI_GATEWAY_PORT (8091).
server {
    listen 80;
    listen 443 ssl;
    listen 8443 ssl;
    ssl_certificate /etc/nginx/tls/gateway.crt;
    ssl_certificate_key /etc/nginx/tls/gateway.key;
    client_max_body_size 14m;
    proxy_read_timeout 65s;
    # Services build public URLs from the forwarded host and the https scheme
    # of the public origin, whichever listener the request arrived on.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    # Upstreams are variables, so nginx resolves service names through Docker
    # DNS at request time and follows recreated containers.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $playground http://playground-server:8000;
    set $authorization http://keycloak:8080;
    set $issuer http://certify:8090;
    set $wallet http://mimoto-service:8099;
    set $verifier http://verify-service:8080;
    set $datashare http://datashare-service:8097;
    set $web http://inji-web:3004;
    set $workbench http://playground-client:80;

    # The token, credential, verifier-request and submission exchanges go
    # through the playground bridge, which forwards them unchanged and records
    # them against the active run. Every other path goes straight to its
    # service.
    location = /v1/certify/issuance/credential {
        proxy_pass $playground/bridge/certify/credential;
    }
    location = /auth/realms/inji/protocol/openid-connect/token {
        proxy_pass $playground/bridge/authorization/protocol/openid-connect/token;
    }
    location /v1/verify/vp-request/ {
        rewrite ^/v1/verify/(.*)$ /bridge/verify/$1 break;
        proxy_pass $playground;
    }
    location /v1/verify/vp-submission/ {
        rewrite ^/v1/verify/(.*)$ /bridge/verify/$1 break;
        proxy_pass $playground;
    }
    location /auth/ { proxy_pass $authorization; }
    location /v1/certify/ { proxy_pass $issuer; }
    # Issuer metadata and the issuer's did:web document at the origin root,
    # where wallets look them up for an issuer identified by the origin.
    location = /.well-known/openid-credential-issuer {
        proxy_pass $issuer/v1/certify/issuance/.well-known/openid-credential-issuer;
    }
    location = /.well-known/did.json {
        proxy_pass $issuer/v1/certify/.well-known/did.json;
    }
    # The workbench, served on the same origin as Mimoto for the embedded
    # wallet.
    location = /playground { return 302 /playground/; }
    location /playground/ {
        rewrite ^/playground/(.*)$ /$1 break;
        proxy_pass $workbench;
    }
    # Playground API, including the WebSocket for live run events.
    location /api/ {
        proxy_pass $playground;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
    # Embedded-wallet actions are served by the playground server under
    # Mimoto's path, so the browser sends its Mimoto session cookie with them.
    location /v1/mimoto/playground/ { proxy_pass $playground; }
    location /v1/mimoto/ { proxy_pass $wallet; }
    location /v1/verify/ { proxy_pass $verifier; }
    location /v1/datashare/ { proxy_pass $datashare; }
    # Rendered static files, such as the JSON-LD context; Inji Web serves the
    # remaining paths.
    location /config/ { alias /srv/inji/; }
    location / { proxy_pass $web; }
}

# Public listener for the mobile-mode tunnel; never published to the host.
# Serves only what a phone wallet and in-stack callbacks need. Admin, API,
# workbench and Certify's offer-creation endpoints stay local.
server {
    listen 8088;
    client_max_body_size 14m;
    proxy_read_timeout 65s;
    # The tunnel terminates TLS, so the forwarded scheme is always https.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $playground http://playground-server:8000;
    set $authorization http://keycloak:8080;
    set $issuer http://certify:8090;
    set $verifier http://verify-service:8080;

    # The Java services drop ;parameters from path segments that nginx matches
    # literally, so such paths could reach endpoints this list does not name.
    if ($uri ~ ";") { return 404; }

    # Token and credential requests go through the bridge, as on the main
    # listener.
    location = /v1/certify/issuance/credential {
        proxy_pass $playground/bridge/certify/credential;
    }
    location = /auth/realms/inji/protocol/openid-connect/token {
        proxy_pass $playground/bridge/authorization/protocol/openid-connect/token;
    }
    # Creating verifier requests stays local; nginx would otherwise 301 the bare path.
    location = /v1/verify/vp-request { return 404; }
    location = /v1/verify/vp-request/ { return 404; }
    # A wallet's request lookups and its submission go through the bridge.
    location /v1/verify/vp-request/ {
        rewrite ^/v1/verify/(.*)$ /bridge/verify/$1 break;
        proxy_pass $playground;
    }
    location /v1/verify/vp-submission/ {
        rewrite ^/v1/verify/(.*)$ /bridge/verify/$1 break;
        proxy_pass $playground;
    }
    # Reached directly: the verifier DID, the inji realm and Keycloak's page
    # resources, and Certify's issuance, discovery and rendering-template
    # paths. Keycloak's admin console and master realm are not listed.
    location = /v1/verify/did.json { proxy_pass $verifier; }
    location /auth/realms/inji/ { proxy_pass $authorization; }
    location /auth/resources/ { proxy_pass $authorization; }
    location /v1/certify/issuance/ { proxy_pass $issuer; }
    location /v1/certify/.well-known/ { proxy_pass $issuer; }
    location /v1/certify/rendering-template/ { proxy_pass $issuer; }
    # Issuer metadata and DID document at the origin root, as on the main
    # listener.
    location = /.well-known/openid-credential-issuer {
        proxy_pass $issuer/v1/certify/issuance/.well-known/openid-credential-issuer;
    }
    location = /.well-known/did.json {
        proxy_pass $issuer/v1/certify/.well-known/did.json;
    }
    # Mimoto stays local: a stock Inji Mobile uses its built-in backend.
    location /config/ { alias /srv/inji/; }
    location / { return 404; }
}
